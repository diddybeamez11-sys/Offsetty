name: Extract Minecraft Offsets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the Minecraft APK"
        required: true
        default: "mc-base"
        type: string

permissions:
  contents: read

jobs:
  extract-offsets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            file \
            binutils \
            llvm \
            python3 \
            python3-pip

      - name: Download Minecraft APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p input

          echo "========================================"
          echo "Downloading Minecraft APK"
          echo "Release: $RELEASE_TAG"
          echo "Asset: Minecraft-1.21.111-arm64-v8a.apk"
          echo "========================================"

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "Minecraft-1.21.111-arm64-v8a.apk" \
            --dir input

          APK="input/Minecraft-1.21.111-arm64-v8a.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Minecraft-1.21.111-arm64-v8a.apk was not found in release '$RELEASE_TAG'."
            echo
            echo "Files found in input:"
            ls -lah input || true
            exit 1
          fi

          echo
          echo "Minecraft APK found:"
          ls -lh "$APK"

          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          echo "Minecraft APK:"
          file "$APK"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Inspect APK contents
        run: |
          echo "Searching for libminecraftpe.so..."

          unzip -l "$APK" | grep -E \
            'lib/arm64-v8a/libminecraftpe\.so$' \
            || true

      - name: Extract ARM64 libminecraftpe.so
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "Extracting ARM64 libminecraftpe.so..."

          unzip -q "$APK" \
            "lib/arm64-v8a/libminecraftpe.so" \
            -d extracted

          LIB="extracted/lib/arm64-v8a/libminecraftpe.so"

          if [ ! -f "$LIB" ]; then
            echo "::error::ARM64 libminecraftpe.so was not found inside the APK."
            echo
            echo "Searching APK for libminecraftpe.so:"
            unzip -l "$APK" | grep "libminecraftpe.so" || true
            exit 1
          fi

          cp "$LIB" libminecraftpe.so

          echo "LIB=$PWD/libminecraftpe.so" >> "$GITHUB_ENV"

          echo
          echo "Extracted library:"
          ls -lh "$LIB"

          echo
          echo "Library type:"
          file "$LIB"

      - name: Calculate library hash
        run: |
          echo "SHA-256 of libminecraftpe.so:"
          sha256sum "$LIB" | tee libminecraftpe.sha256

      - name: Read ELF information
        run: |
          mkdir -p report

          echo "Reading ELF information..."

          file "$LIB" > report/file.txt

          readelf -h "$LIB" \
            > report/elf-header.txt

          readelf -l "$LIB" \
            > report/program-headers.txt

          readelf -S "$LIB" \
            > report/sections.txt

          readelf -d "$LIB" \
            > report/dynamic.txt

          readelf -n "$LIB" \
            > report/notes.txt

      - name: Extract exported symbols
        run: |
          echo "Extracting dynamic symbols..."

          nm -D --defined-only "$LIB" \
            > report/dynamic-symbols.txt 2>&1 || true

          readelf --dyn-syms --wide "$LIB" \
            > report/dynamic-symbols-readelf.txt 2>&1 || true

          echo
          echo "Dynamic symbol count:"
          wc -l report/dynamic-symbols.txt || true

      - name: Extract strings
        run: |
          echo "Extracting strings..."

          strings -a -n 4 "$LIB" \
            > report/strings.txt

          echo "String count:"
          wc -l report/strings.txt

      - name: Extract useful Minecraft strings
        run: |
          echo "Searching for useful Minecraft strings..."

          grep -Ei \
            'Actor|Player|Mob|LocalPlayer|GameMode|Level|BlockSource|MinecraftClient|MinecraftGame|Move|Jump|Attack|Inventory|Item|Block' \
            report/strings.txt \
            > report/minecraft-strings.txt \
            || true

          echo
          echo "Matching Minecraft strings:"
          wc -l report/minecraft-strings.txt || true

      - name: Generate basic offset database
        run: |
          if [ ! -f tools/extract_offsets.py ]; then
            echo "::error::tools/extract_offsets.py does not exist."
            exit 1
          fi

          echo "Generating offset database..."

          python3 tools/extract_offsets.py \
            "$LIB" \
            report/offsets.json

      - name: Build human-readable summary
        run: |
          if [ ! -f tools/make_offset_report.py ]; then
            echo "::error::tools/make_offset_report.py does not exist."
            exit 1
          fi

          echo "Generating human-readable offset report..."

          python3 tools/make_offset_report.py \
            "$LIB" \
            report/offsets.txt

      - name: Display analysis summary
        run: |
          echo
          echo "========================================"
          echo " Minecraft Offset Analysis Complete"
          echo "========================================"
          echo
          echo "Release:"
          echo "$RELEASE_TAG"
          echo
          echo "APK:"
          echo "$APK"
          echo
          echo "Library:"
          echo "$LIB"
          echo
          echo "Files generated:"
          find report -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          echo "Offset database:"
          ls -lh report/offsets.json
          echo
          echo "Offset report:"
          ls -lh report/offsets.txt

      - name: Package results
        run: |
          rm -rf offsets
          mkdir -p offsets

          cp -r report offsets/
          cp "$LIB" offsets/libminecraftpe.so
          cp libminecraftpe.sha256 offsets/

          cd offsets

          zip -r ../minecraft-offsets.zip .

          cd ..

          echo
          echo "Created:"
          ls -lh minecraft-offsets.zip

      - name: Upload offset artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-offsets
          path: |
            minecraft-offsets.zip
            report/offsets.json
            report/offsets.txt
            report/dynamic-symbols.txt
            report/dynamic-symbols-readelf.txt
            report/sections.txt
            report/elf-header.txt
            report/program-headers.txt
            report/dynamic.txt
            report/notes.txt
            report/minecraft-strings.txt
            libminecraftpe.sha256
          if-no-files-found: error
