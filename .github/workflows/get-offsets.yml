name: Extract Minecraft Offsets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the Minecraft APK"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  extract-offsets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            file \
            binutils \
            llvm \
            python3 \
            python3-pip

      - name: Download Minecraft APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p input

          if [ "$RELEASE_TAG" = "latest" ]; then
            echo "Finding latest GitHub release..."
            gh release download \
              --repo "${{ github.repository }}" \
              --pattern "*.apk" \
              --dir input
          else
            echo "Downloading APK from release: $RELEASE_TAG"
            gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "*.apk" \
              --dir input
          fi

          echo "Downloaded files:"
          ls -lh input

          APK="$(find input -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was found in the release."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          echo "Minecraft APK:"
          file "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Extract ARM64 libminecraftpe.so
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$APK" \
            "lib/arm64-v8a/libminecraftpe.so" \
            -d extracted

          LIB="extracted/lib/arm64-v8a/libminecraftpe.so"

          if [ ! -f "$LIB" ]; then
            echo "::error::ARM64 libminecraftpe.so was not found."
            exit 1
          fi

          cp "$LIB" libminecraftpe.so

          echo "LIB=$PWD/libminecraftpe.so" >> "$GITHUB_ENV"

          ls -lh "$LIB"
          file "$LIB"

      - name: Calculate library hash
        run: |
          sha256sum "$LIB" | tee libminecraftpe.sha256

      - name: Read ELF information
        run: |
          mkdir -p report

          file "$LIB" > report/file.txt

          readelf -h "$LIB" > report/elf-header.txt
          readelf -l "$LIB" > report/program-headers.txt
          readelf -S "$LIB" > report/sections.txt
          readelf -d "$LIB" > report/dynamic.txt
          readelf -n "$LIB" > report/notes.txt

      - name: Extract exported symbols
        run: |
          echo "Extracting dynamic symbols..."

          nm -D --defined-only "$LIB" \
            > report/dynamic-symbols.txt 2>&1 || true

          readelf --dyn-syms --wide "$LIB" \
            > report/dynamic-symbols-readelf.txt 2>&1 || true

      - name: Extract strings
        run: |
          strings -a -n 4 "$LIB" \
            > report/strings.txt

      - name: Extract useful Minecraft strings
        run: |
          grep -Ei \
            'Actor|Player|Mob|LocalPlayer|GameMode|Level|BlockSource|MinecraftClient|MinecraftGame|Move|Jump|Attack|Inventory|Item|Block' \
            report/strings.txt \
            > report/minecraft-strings.txt || true

      - name: Generate basic offset database
        run: |
          python3 tools/extract_offsets.py \
            "$LIB" \
            report/offsets.json

      - name: Build human-readable summary
        run: |
          python3 tools/make_offset_report.py \
            "$LIB" \
            report/offsets.txt

      - name: Package results
        run: |
          mkdir -p offsets

          cp -r report offsets/
          cp "$LIB" offsets/libminecraftpe.so
          cp libminecraftpe.sha256 offsets/

          cd offsets
          zip -r ../minecraft-offsets.zip .

      - name: Upload offset artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-offsets
          path: |
            minecraft-offsets.zip
            report/offsets.json
            report/offsets.txt
            report/dynamic-symbols.txt
            report/sections.txt
            libminecraftpe.sha256
          if-no-files-found: error
:::

